name: Paper3 Minimal Novelty Matched Comparator Single GPU Run
on:
  push:
    branches: [paper3/minimal-novelty-defense]
    paths: [paper3/START_MINIMAL_NOVELTY_ONCE.txt]
permissions:
  contents: read
concurrency:
  group: paper3-penn-minimal-one-pod
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Ensure prerequisites
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          test -n "$RUNPOD_API_KEY"
          test -f paper3/src/paper3/minimal_novelty.py
          test -f paper3/src/paper3/build_manifest.py
      - name: CPU preflight before renting GPU
        run: |
          cd paper3/src
          python -m pip install -q -r requirements.txt
          python -m compileall -q paper3 tests
          python -m unittest discover -s tests -v
      - name: Install RunPod CLI
        run: |
          curl -fLsS --retry 4 https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -o /tmp/runpodctl
          chmod +x /tmp/runpodctl
          sudo mv /tmp/runpodctl /usr/local/bin/runpodctl
          runpodctl version
      - name: Build remote training script
        id: bootstrap
        run: |
          cat > /tmp/paper3-minimal.sh <<'POD'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          started=$(date -u +%FT%TZ)
          echo "PAPER3_MINIMAL_BEGIN:$started"
          onexit(){ rc=$?; if [ "$rc" -ne 0 ]; then echo "PAPER3_MINIMAL_FAILED:$rc"; fi; }
          trap onexit EXIT
          mkdir -p /workspace/paper3 && cd /workspace/paper3
          wget --tries=5 --timeout=120 -c -O Penn_Action.tar.gz https://www.cis.upenn.edu/~kostas/Penn_Action.tar.gz
          test "$(stat -c%s Penn_Action.tar.gz)" = "3235203923"
          python - <<'PY'
          import tarfile,pathlib
          d=pathlib.Path('/workspace/paper3/data');d.mkdir(exist_ok=True)
          with tarfile.open('/workspace/paper3/Penn_Action.tar.gz') as a:a.extractall(d,filter='data')
          PY
          git clone --depth=20 --branch paper3/minimal-novelty-defense https://github.com/advanceresearchhr-netizen/Advance_research.git repo
          cd repo && git checkout f03c9c21057b1e597d2e4f94db1672b2309988d2 && cd paper3/src
          python -m pip install -q -r requirements.txt
          python -m unittest discover -s tests -v
          python -m paper3.build_manifest --data-root /workspace/paper3/data/Penn_Action --out /workspace/paper3/penn_manifest.csv
          echo "Reviewer campaign GPU data-backed smoke check before full training"
          PAPER3_COMMIT=$(git rev-parse HEAD) python -m paper3.minimal_novelty --manifest /workspace/paper3/penn_manifest.csv --data-root /workspace/paper3/data/Penn_Action --out /workspace/paper3/reviewer_smoke --device cuda --smoke
          echo "Reviewer smoke complete; starting full predeclared experiment"
          PAPER3_COMMIT=$(git rev-parse HEAD) python -m paper3.minimal_novelty --manifest /workspace/paper3/penn_manifest.csv --data-root /workspace/paper3/data/Penn_Action --out /workspace/paper3/results --device cuda
          cp /workspace/paper3/penn_manifest.csv /workspace/paper3/results/penn_manifest.csv
          cd /workspace/paper3
          python - <<'PY'
          import pathlib,json
          d=pathlib.Path('results')
          p=json.loads((d/'provenance.json').read_text())
          assert p['completed'] and not p['smoke']
          for name in ('reference','film','mask'):
           for seed in (42,123,2026):
            f=d/f'{name}_seed{seed}.pt'
            assert f.is_file() and f.stat().st_size>10000,f
          assert (d/'matched_metrics.csv').stat().st_size>200
          assert (d/'matched_predictions.csv').stat().st_size>100000
          assert (d/'histories.json').stat().st_size>100
          print('PAPER3_MINIMAL_RESULTS_VALIDATED')
          PY
          tar -czf paper3_minimal_results.tar.gz results
          sha256sum paper3_minimal_results.tar.gz
          echo "PAPER3_MINIMAL_TRANSFER_READY"
          runpodctl send paper3_minimal_results.tar.gz
          echo "PAPER3_MINIMAL_TRANSFER_COMPLETED"
          POD
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64
          print("b64="+base64.b64encode(open('/tmp/paper3-minimal.sh','rb').read()).decode())
          PY
      - name: Create one RTX4090 pod
        id: create
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SCRIPT_B64: ${{ steps.bootstrap.outputs.b64 }}
        run: |
          ENV_JSON=$(python -c 'import os,json;print(json.dumps({"SCRIPT_B64":os.environ["SCRIPT_B64"]}))')
          runpodctl pod create --name paper3-penn-minimal-once --image runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04 --gpu-id "NVIDIA GeForce RTX 4090" --gpu-count 1 --container-disk-in-gb 65 --env "$ENV_JSON" --docker-args 'bash -lc "echo $SCRIPT_B64 | base64 -d > /tmp/paper3.sh && exec timeout --signal=TERM --kill-after=60s 255m bash /tmp/paper3.sh"' --output json > pod_response.json
          python - <<'PY'
          import json
          v=json.load(open('pod_response.json'))
          assert v.get('id')
          open('pod_id.txt','w').write(v['id'])
          print('Pod created; ID recorded for unconditional deletion')
          PY
      - name: Fetch results from Pod before shutdown
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -Eeuo pipefail
          POD_ID=$(cat pod_id.txt)
          : > paper3-minimal.log
          TRANSFER_CODE=""
          for i in $(seq 1 730); do
            runpodctl pod logs "$POD_ID" --tail 1500 --source container > raw.jsonl 2>/dev/null || true
            python - <<'PY' > paper3-minimal.log
          import json
          for line in open('raw.jsonl',errors='replace'):
           try:print(json.loads(line).get('line',''))
           except:pass
          PY
            if grep -q '^PAPER3_MINIMAL_FAILED:' paper3-minimal.log; then
              tail -n 100 paper3-minimal.log
              exit 1
            fi
            if grep -q 'Code is:' paper3-minimal.log; then
              TRANSFER_CODE=$(sed -n 's/^.*Code is: *\([A-Za-z0-9-]*\).*$/\1/p' paper3-minimal.log | tail -1)
              if [ -n "$TRANSFER_CODE" ]; then break; fi
            fi
            sleep 20
          done
          test -n "$TRANSFER_CODE" || { echo "No result-transfer code received within polling time"; exit 1; }
          echo "Receiving verified results archive over encrypted RunPod transfer"
          timeout 35m runpodctl receive "$TRANSFER_CODE"
          python - <<'PY'
          from pathlib import Path
          import tarfile,json
          p=Path('paper3_minimal_results.tar.gz')
          assert p.stat().st_size>1000000
          with tarfile.open(p) as tf:
           names=set(tf.getnames())
           assert 'results/provenance.json' in names
           proven=json.load(tf.extractfile('results/provenance.json'))
           assert proven['completed'] and not proven['smoke']
           for name in ('reference','film','mask'):
            for seed in (42,123,2026):
             assert f'results/{name}_seed{seed}.pt' in names
           assert 'results/matched_predictions.csv' in names
           assert 'results/matched_metrics.csv' in names
          print('PAPER3_MINIMAL_ARTIFACT_VALIDATED')
          PY
      - name: Upload model weights and metrics as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paper3-penn-minimal-evidence-results
          path: paper3_minimal_results.tar.gz
          if-no-files-found: error
          retention-days: 90
      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper3-penn-minimal-audit
          path: |
            paper3-minimal.log
          if-no-files-found: warn
          retention-days: 90
      - name: Delete RunPod GPU
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -Eeuo pipefail
          if [ -s pod_id.txt ]; then
            POD_ID=$(cat pod_id.txt)
            for i in 1 2 3 4; do
              if runpodctl pod delete "$POD_ID"; then echo "PAPER3_MINIMAL_POD_DELETE_CONFIRMED:$POD_ID"; exit 0; fi
              sleep 10
            done
            echo "CRITICAL: POD DELETION FAILED; manually delete $POD_ID in RunPod now"
            exit 1
          fi
          echo "No recorded pod ID. Verify RunPod console if creation was interrupted."
