paper2:
  title: Faithful Explainable Multimodal HAR
  dataset: UTD_MHAD
  dataset_source: official_UT_Dallas
  dataset_facts:
    actions: 27
    subjects: 8
    sequences: 861
    modalities: [rgb, skeleton_3d]
  split:
    train_subjects: [1, 3, 5, 7]
    test_subjects: [2, 4, 6, 8]
    source: original_UTD_MHAD_paper
  seed_set: [42, 123, 2026]
  model_selection:
    method: leave_one_training_subject_out
    subjects: [1, 3, 5, 7]
    final_retrain: all_training_subjects
    final_test_once: true
  derived_evidence: [skeleton_motion]
  xai_levels: [temporal, rgb_region, skeleton_joint, modality]
  primary_xai_tests:
    - deletion_auc
    - confidence_drop_topk
    - matched_random_control
    - bottom_vs_top
    - stability_small_perturbation
  secondary_xai_tests: [insertion_auc]
  recognition_metrics: [top1_accuracy, macro_f1, per_class_recall]
  integrity:
    test_tuning: false
    subject_independent_test: true
    archive_before_gpu_delete: true
    require_random_xai_baseline: true
    require_paired_confidence_intervals: true
  gpu_launch_gate:
    require_official_dataset: true
    require_rgb_skeleton_pairing_preflight: true
    require_smoke_test: true
    require_artifact_upload: true
