name: Research GPU Pod Smoke Test
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: RunPod GPU type
        required: true
        default: NVIDIA GeForce RTX 4090
        type: string
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install current runpodctl
        run: |
          wget --quiet --show-progress https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /tmp/runpodctl
          chmod +x /tmp/runpodctl
          sudo mv /tmp/runpodctl /usr/local/bin/runpodctl
          runpodctl version
      - name: Create, verify and delete ephemeral GPU Pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_GPU: ${{ inputs.gpu }}
        run: python runner/launch_job.py
