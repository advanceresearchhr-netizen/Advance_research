name: Paper2 UTD Preflight
on:
  push:
    paths:
      - 'paper2/preflight-trigger.txt'
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify authoritative dataset page and resolve sources
        run: |
          python paper2/discover_official_utd_links.py > paper2/dataset_sources.json
          python - <<'PY'
          import urllib.request
          u="https://personal.utdallas.edu/~kehtar/UTD-MHAD.html"
          x=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=30)
          body=x.read().decode("utf-8","ignore")
          for token in ["RGB_Data.zip","Skeleton_Data.zip","861","27"]:
              assert token in body, f"official page missing {token}"
          print("OFFICIAL_PAGE_OK",x.status,len(body))
          PY
      - name: Probe legacy archive URLs with GET
        run: |
          python - <<'PY'
          import json,urllib.request
          d=json.load(open("paper2/dataset_sources.json"))
          out={}
          for kind in ("rgb","skeleton"):
            out[kind]=[]
            for u in d[kind]:
              try:
                req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Range":"bytes=0-1023"})
                x=urllib.request.urlopen(req,timeout=30)
                b=x.read(1024)
                out[kind].append({"url":u,"status":x.status,"resolved":x.geturl(),"bytes":len(b),"zip_magic":b[:2]==b"PK"})
              except Exception as e:
                out[kind].append({"url":u,"error":str(e)})
          open("paper2/source_probe.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper2-utd-preflight
          path: |
            paper2/dataset_sources.json
            paper2/source_probe.json
          retention-days: 30
