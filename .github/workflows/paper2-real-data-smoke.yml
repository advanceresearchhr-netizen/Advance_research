name: Paper2 Real Data Smoke
on:
  push:
    paths: ['paper2/real-data-smoke-trigger.txt']
  workflow_dispatch:
jobs:
  real-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Download official paired modalities
        run: |
          curl -fL --retry 4 -o RGB.zip https://personal.utdallas.edu/~kehtar/UTD-MAD/RGB.zip
          curl -fL --retry 4 -o Skeleton.zip https://personal.utdallas.edu/~kehtar/UTD-MAD/Skeleton.zip
          echo "058dded078b2c21eff901d98fe0a86d5343d11e9d6c07081aaa3e3280a43052b  RGB.zip" | sha256sum -c -
          echo "f029ea1d4e4c330b2c61307b6d532b34c3920bcac1f4c22c7827f406e2c7ac00  Skeleton.zip" | sha256sum -c -
      - run: pip -q install torch scipy opencv-python-headless
      - name: Real paired batch forward backward
        run: python paper2/real_data_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-real-data-smoke
          path: paper2/real_data_smoke_result.json
          retention-days: 90
