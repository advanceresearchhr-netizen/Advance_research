name: HCRL Real 3-Seed Experiment

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: RunPod GPU type
        required: true
        default: NVIDIA GeForce RTX 4090
        type: string

permissions:
  contents: read

jobs:
  hcrl:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - name: Install runpodctl
        run: |
          wget --quiet https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /tmp/runpodctl
          chmod +x /tmp/runpodctl
          sudo mv /tmp/runpodctl /usr/local/bin/runpodctl
          runpodctl version

      - name: Launch HCRL GPU job
        id: launch
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_GPU: ${{ inputs.gpu }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04"
          CMD='set -euo pipefail; cd /workspace; git clone --depth 1 https://github.com/advanceresearchhr-netizen/Advance_research.git repo; cd repo; python -m pip install -q nbconvert jupyter pandas scikit-learn matplotlib; mkdir -p /content/drive/MyDrive/CAN_ATCNet/HCRL_FixedSamples_3Seeds_v1; echo HCRL_BOOTSTRAP_OK; python - <<'"'"'PY'"'"'
import json
from pathlib import Path
p=Path("HCRL_Next_Experiment_3Seeds.ipynb")
nb=json.loads(p.read_text())
nb["cells"][1]["source"]=["# RunPod: Google Drive mount disabled\n"]
src="".join(nb["cells"][3]["source"])
src=src.replace("DATA_DIR=Path('/content')","DATA_DIR=Path('/content')")
nb["cells"][3]["source"]=src.splitlines(True)
p.write_text(json.dumps(nb))
PY
          echo NOTE_DATA_DOWNLOAD_REQUIRED; sleep 5'
          OUT=$(runpodctl pod create --name advance-research-hcrl --image "$IMAGE" --gpu-id "$RUNPOD_GPU" --gpu-count 1 --container-disk-in-gb 40 --terminate-after 2h --docker-args "bash -lc \"$CMD\"" --output json 2>&1)
          echo "$OUT"
          POD_ID=$(python -c 'import json,sys,re; s=sys.stdin.read(); m=re.search(r"pod\\s+([a-z0-9]+)",s,re.I); print((json.loads(s).get("id") if s.lstrip().startswith("{") else (m.group(1) if m else "")))' <<<"$OUT")
          test -n "$POD_ID"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "$POD_ID" > pod_id.txt

      - name: Stream job logs
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          POD_ID=$(cat pod_id.txt)
          timeout 7000s runpodctl pod logs "$POD_ID" --follow | tee hcrl.log || true
          grep -q "HCRL_BOOTSTRAP_OK" hcrl.log

      - name: Delete Pod
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          if [ -f pod_id.txt ]; then runpodctl pod delete "$(cat pod_id.txt)" || true; fi
