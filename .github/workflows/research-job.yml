name: Research GPU Smoke Test
on:
  workflow_dispatch:
    inputs:
      endpoint_id:
        description: RunPod Serverless endpoint ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r runner/requirements.txt
      - name: Call RunPod endpoint
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ inputs.endpoint_id }}
        run: python runner/launch_job.py
