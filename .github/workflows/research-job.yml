name: HCRL Real 3-Seed Experiment

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: RunPod GPU type
        required: true
        default: NVIDIA GeForce RTX 4090
        type: string

permissions:
  contents: read

jobs:
  hcrl:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify experiment notebook
        run: |
          test -f HCRL_Next_Experiment_3Seeds.ipynb
          python -c "import json; json.load(open('HCRL_Next_Experiment_3Seeds.ipynb')); print('Notebook OK')"

      - name: Install runpodctl
        run: |
          wget --quiet https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /tmp/runpodctl
          chmod +x /tmp/runpodctl
          sudo mv /tmp/runpodctl /usr/local/bin/runpodctl
          runpodctl version

      - name: Dataset preflight
        run: |
          echo "Workflow registered successfully."
          echo "GPU launch remains gated until the automated dataset source is configured."
          exit 1
