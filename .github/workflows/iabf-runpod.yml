name: IABF Multi-PIE 50-image RunPod GPU
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: RunPod GPU
        type: string
        required: true
        default: NVIDIA GeForce RTX 4090
      seed:
        description: Experiment seed
        type: choice
        options: ['42', '123', '2026']
        default: '42'
      epochs:
        description: Gate adaptation epochs
        type: number
        default: 30
        required: true
permissions:
  contents: read
concurrency:
  group: iabf-multipie-runpod
  cancel-in-progress: false
jobs:
  iabf-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      IABF_ASSETS_DATASET: ${{ secrets.IABF_ASSETS_DATASET }}
      RUNPOD_GPU: ${{ inputs.gpu }}
      IABF_SEED: ${{ inputs.seed }}
      IABF_EPOCHS: ${{ inputs.epochs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/iabf-multipie-50image-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free preflight - reject missing credentials before provisioning GPU
        shell: bash
        run: |
          set -euo pipefail
          for key in RUNPOD_API_KEY KAGGLE_USERNAME KAGGLE_KEY IABF_ASSETS_DATASET; do
            test -n "${!key}" || { echo "::error::Required secret $key is missing"; exit 1; }
          done
          test -f iabf/iabf_multipie_complete.py
          python -m py_compile iabf/iabf_multipie_complete.py
          printf 'IABF_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          assert os.getenv("IABF_ASSETS_DATASET","").count("/")==1, "IABF_ASSETS_DATASET must be owner/slug"
          assert os.getenv("IABF_SEED") in ("42","123","2026")
          assert 1 <= int(os.environ["IABF_EPOCHS"]) <= 100
          print("IABF_PREFLIGHT_OK: no GPU started yet")
          PY
      - name: Verify Kaggle dataset assets are visible before GPU billing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet kaggle
          python - <<'PY'
          import os
          from pathlib import PurePosixPath
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi();api.authenticate()
          needed={"best_standard_recognizer.pth","best_casia_recognizer.pth","multipie_manifest.csv"}
          info=api.dataset_list_files(os.environ["IABF_ASSETS_DATASET"])
          found={PurePosixPath(x.name).name for x in (info.files or [])}
          missing=needed-found
          if missing:raise RuntimeError(f"Private Kaggle assets dataset missing: {sorted(missing)}")
          public=api.dataset_list_files("aliates/multi-pie")
          if not (public.files or []):raise RuntimeError("Public Multi-PIE Kaggle dataset has no listed files")
          print("IABF_KAGGLE_ASSETS_METADATA_OK")
          print("Dataset file count:",len(public.files))
          PY
      - name: Install RunPod CLI
        run: |
          set -euo pipefail
          wget -q https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /tmp/runpodctl
          chmod +x /tmp/runpodctl
          sudo mv /tmp/runpodctl /usr/local/bin/runpodctl
          runpodctl version
      - name: Generate isolated pod bootstrap
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/iabf_bootstrap.sh <<'IABF_SCRIPT'
          set -Eeuo pipefail
          trap 'rc=$?; echo "IABF_FAILED code=$rc line=$LINENO"; exit $rc' ERR
          export MPLBACKEND=Agg PYTHONUNBUFFERED=1
          echo IABF_POD_STARTED
          mkdir -p /workspace/iabf/data /workspace/iabf/assets /workspace/iabf/results
          cd /workspace/iabf
          python -m pip install -q kaggle facenet-pytorch face-alignment opencv-python-headless matplotlib scikit-learn pandas Pillow
          kaggle datasets download -d aliates/multi-pie --unzip -p /workspace/iabf/data
          kaggle datasets download -d "$IABF_ASSETS_DATASET" --unzip -p /workspace/iabf/assets
          python - <<'PY'
          import shutil
          from pathlib import Path
          p=Path('/workspace/iabf/assets')
          required=['best_standard_recognizer.pth','best_casia_recognizer.pth','multipie_manifest.csv']
          for name in required:
              found=list(p.rglob(name))
              if len(found)!=1:raise RuntimeError(f'{name}: expected one file in private dataset, got {len(found)}')
              dest=Path('/workspace/iabf/data')/name if name.endswith('.csv') else p/name
              if found[0]!=dest:shutil.copyfile(found[0],dest)
              print('IABF_ASSET_OK',name,'bytes',dest.stat().st_size)
          PY
          git clone --depth 1 --branch research/iabf-multipie-50image-ci https://github.com/advanceresearchhr-netizen/Advance_research.git /workspace/iabf/repo
          cd /workspace/iabf/repo
          test "$(git rev-parse HEAD)" = "$IABF_COMMIT" || { echo "IABF commit mismatch"; exit 1; }
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "No CUDA GPU available"
          print("IABF_CUDA_OK",torch.cuda.get_device_name(0))
          PY
          echo IABF_DRY_RUN_START
          python -u iabf/iabf_multipie_complete.py --manifest /workspace/iabf/data/multipie_manifest.csv --baseline /workspace/iabf/assets/best_standard_recognizer.pth --proposed /workspace/iabf/assets/best_casia_recognizer.pth --output /workspace/iabf/results --seed "$IABF_SEED" --epochs "$IABF_EPOCHS" --dry-run
          echo IABF_TRAINING_START
          python -u iabf/iabf_multipie_complete.py --manifest /workspace/iabf/data/multipie_manifest.csv --baseline /workspace/iabf/assets/best_standard_recognizer.pth --proposed /workspace/iabf/assets/best_casia_recognizer.pth --output /workspace/iabf/results --seed "$IABF_SEED" --epochs "$IABF_EPOCHS"
          python - <<'PY'
          from pathlib import Path
          import zipfile,base64,hashlib
          root=Path('/workspace/iabf/results')
          chosen=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ('.csv','.json','.png','.txt') and p.stat().st_size<8_000_000]
          assert (root/'experiment_provenance.json').is_file()
          package=Path('/tmp/iabf_results.zip')
          with zipfile.ZipFile(package,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=8) as z:
              for f in chosen:z.write(f,f.relative_to(root))
          data=package.read_bytes()
          if len(data)>8_000_000:raise RuntimeError('Result archive over 8MB log-transfer limit; keep pod for manual artifact recovery')
          s=base64.b64encode(data).decode()
          print('IABF_BUNDLE_BEGIN',len(data),hashlib.sha256(data).hexdigest(),flush=True)
          for i in range(0,len(s),1500):print('IABF_CHUNK',i//1500,s[i:i+1500],flush=True)
          print('IABF_BUNDLE_END',flush=True)
          print('IABF_RESULTS_FILES',len(chosen),flush=True)
          PY
          echo IABF_DONE
          sleep infinity
          IABF_SCRIPT
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import base64
          print("script_b64="+base64.b64encode(open("/tmp/iabf_bootstrap.sh","rb").read()).decode())
          PY
      - name: Start isolated IABF RunPod
        id: pod
        shell: bash
        env:
          IABF_BOOTSTRAP_B64: ${{ steps.bootstrap.outputs.script_b64 }}
        run: |
          set -euo pipefail
          ENV_JSON=$(python - <<'PY'
          import json,os
          fields=('IABF_BOOTSTRAP_B64','IABF_ASSETS_DATASET','KAGGLE_USERNAME','KAGGLE_KEY','IABF_SEED','IABF_EPOCHS','IABF_COMMIT')
          print(json.dumps({k:os.environ[k] for k in fields}))
          PY
          )
          OUT=$(runpodctl pod create --name iabf-multipie-50img --image runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04 --gpu-id "$RUNPOD_GPU" --gpu-count 1 --container-disk-in-gb 80 --env "$ENV_JSON" --docker-args 'bash -lc "echo $IABF_BOOTSTRAP_B64 | base64 -d >/tmp/iabf_bootstrap.sh && exec bash /tmp/iabf_bootstrap.sh"' --output json)
          POD_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$OUT")
          test -n "$POD_ID"
          printf '%s\n' "$POD_ID" >pod_id.txt
          echo "IABF_POD_CREATED $POD_ID"
      - name: Watch IABF and recover compressed results
        shell: bash
        run: |
          set -euo pipefail
          POD_ID=$(cat pod_id.txt)
          for i in $(seq 1 630); do
            runpodctl pod logs "$POD_ID" --tail 20000 --source container > podlogs.jsonl 2>/dev/null || true
            python - <<'PY'
          import json
          from pathlib import Path
          with open('iabf.log','w') as out:
              for line in Path('podlogs.jsonl').read_text(errors='replace').splitlines():
                  try:print(json.loads(line).get('line',''),file=out)
                  except Exception:pass
          PY
            tail -n 5 iabf.log | cut -c 1-180 || true
            if grep -q '^IABF_DONE$' iabf.log; then
              python - <<'PY'
          from pathlib import Path
          import base64,hashlib,zipfile,io
          lines=Path('iabf.log').read_text(errors='replace').splitlines()
          header=next((s for s in lines if s.startswith('IABF_BUNDLE_BEGIN ')),None)
          assert header, 'Missing result bundle header'
          _,size,checksum=header.split()
          chunks={}
          for line in lines:
              if line.startswith('IABF_CHUNK '):
                  _,num,data=line.split(' ',2)
                  chunks[int(num)]=data
          assert chunks and sorted(chunks)==list(range(max(chunks)+1)), 'Missing log transfer chunk(s)'
          assert 'IABF_BUNDLE_END' in lines
          content=base64.b64decode(''.join(chunks[k] for k in sorted(chunks)),validate=True)
          assert len(content)==int(size) and hashlib.sha256(content).hexdigest()==checksum, 'Result bundle integrity error'
          Path('iabf_results.zip').write_bytes(content)
          with zipfile.ZipFile(io.BytesIO(content)) as z:
              assert 'experiment_provenance.json' in z.namelist()
              print('IABF_RESULTS_RECOVERED',len(z.namelist()),'files')
          PY
              exit 0
            fi
            if grep -q '^IABF_FAILED ' iabf.log; then echo "::error::IABF GPU execution failed";exit 1;fi
            if ! runpodctl pod get "$POD_ID" --output json >/dev/null 2>&1;then echo "::error::RunPod missing before completion";exit 1;fi
            sleep 20
          done
          echo "::error::Timed out waiting for IABF GPU results";exit 1
      - name: Upload IABF research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iabf-50img-runpod-${{ github.run_id }}
          path: |
            iabf_results.zip
            iabf.log
          if-no-files-found: warn
          retention-days: 30
      - name: Delete only the IABF RunPod
        if: always()
        shell: bash
        run: |
          if [ -s pod_id.txt ];then
            runpodctl pod delete "$(cat pod_id.txt)" || true
          fi
